<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Venstre / Højre</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#c8102e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Venstre/Højre">
  <style>
    :root {
      --bg: #f6f5f2;
      --fg: #1d1d1f;
      --muted: #6b6b70;
      --accent: #c8102e;
      --card: #ffffff;
      --border: #e2e0db;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141416;
        --fg: #f2f2f4;
        --muted: #9a9aa2;
        --accent: #ff4d5e;
        --card: #1e1e22;
        --border: #2e2e34;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    main {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
    }
    h1 { margin: 0 0 4px; font-size: 1.5rem; }
    .sub { margin: 0 0 28px; color: var(--muted); font-size: 0.95rem; }
    .timer {
      font-size: 4rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .timer.rest { color: var(--muted); }
    .timer.countdown { color: var(--accent); }
    .command {
      height: 2.5rem;
      margin: 20px 0 28px;
      font-size: 2rem;
      font-weight: 600;
      color: var(--accent);
    }
    button {
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 600;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button.stop { background: var(--muted); }
    .tempo { margin-top: 24px; text-align: left; }
    .tempo label { display: flex; justify-content: space-between; font-size: 0.95rem; color: var(--muted); }
    .tempo output { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
    .tempo input { width: 100%; margin: 10px 0 0; accent-color: var(--accent); }
    .tempo .scale { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); }
    .stats { margin-top: 16px; color: var(--muted); font-size: 0.9rem; min-height: 1.2em; }
    .warn { margin-top: 16px; color: var(--accent); font-size: 0.85rem; }
    footer { margin-top: 16px; color: var(--muted); font-size: 0.8rem; text-align: center; }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Venstre / Højre</h1>
    <p class="sub" id="sub">Tilfældige kommandoer i 60 sekunder</p>
    <div class="timer" id="timer">60</div>
    <div class="command" id="command"></div>
    <button id="toggle">Start</button>
    <div class="tempo">
      <label for="tempo">Tempo <output id="tempoValue">1.0×</output></label>
      <input type="range" id="tempo" min="0.5" max="2" step="0.1" value="1">
      <div class="scale"><span>Langsom</span><span>Hurtig</span></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="warn" id="warn" hidden></div>
  </main>
  <footer>
    Version 1.1.0 · <a href="mailto:app@andreasen.cc">app@andreasen.cc</a>
  </footer>

  <script>
    // Round length; override with ?seconds=10 for quick testing
    const ROUND_SECONDS = (() => {
      const n = parseInt(new URLSearchParams(location.search).get("seconds"), 10);
      return n > 0 ? n : 60;
    })();
    // Pause between the direction and "tilbage" (ms)
    const TO_BACK_MIN = 250, TO_BACK_MAX = 700;
    // Pause between "tilbage" and the next direction (ms)
    const TO_NEXT_MIN = 350, TO_NEXT_MAX = 1000;
    const BASE_SPEECH_RATE = 1.3;

    const timerEl = document.getElementById("timer");
    const commandEl = document.getElementById("command");
    const button = document.getElementById("toggle");
    const statsEl = document.getElementById("stats");
    const warnEl = document.getElementById("warn");
    const tempoEl = document.getElementById("tempo");
    const tempoValueEl = document.getElementById("tempoValue");
    timerEl.textContent = ROUND_SECONDS;
    document.getElementById("sub").textContent = `Tilfældige kommandoer i ${ROUND_SECONDS} sekunder`;

    let running = false;
    let session = 0; // bumps on each start so a stale loop from a previous round exits
    let endTime = 0;
    let tickHandle = null;
    let waitHandle = null;
    let restHandle = null;
    let counts = { venstre: 0, højre: 0 };
    let danishVoice = null;
    let tempo = 1;

    // Tempo divides the pauses; the voice speeds up more gently so words stay clear
    function setTempo(value) {
      tempo = Math.min(2, Math.max(0.5, Number(value) || 1));
      tempoEl.value = tempo;
      tempoValueEl.textContent = `${tempo.toFixed(1)}×`;
    }
    try { setTempo(localStorage.getItem("tempo") ?? 1); } catch { setTempo(1); }
    tempoEl.addEventListener("input", () => {
      setTempo(tempoEl.value);
      try { localStorage.setItem("tempo", tempo); } catch {}
    });
    const pauseMs = (min, max) => rand(min, max) / tempo;

    function pickVoice() {
      const voices = speechSynthesis.getVoices();
      danishVoice = voices.find(v => v.lang.toLowerCase().replace("_", "-").startsWith("da")) || null;
      if (voices.length && !danishVoice) {
        warnEl.hidden = false;
        warnEl.textContent = "Ingen dansk stemme fundet på denne enhed – udtalen kan lyde forkert.";
      }
    }

    if (!("speechSynthesis" in window)) {
      warnEl.hidden = false;
      warnEl.textContent = "Din browser understøtter ikke tale.";
      button.disabled = true;
    } else {
      pickVoice();
      speechSynthesis.addEventListener("voiceschanged", pickVoice);
    }

    const rand = (min, max) => min + Math.random() * (max - min);

    function wait(ms) {
      return new Promise(resolve => { waitHandle = setTimeout(resolve, ms); });
    }

    function say(text) {
      return new Promise(resolve => {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "da-DK";
        if (danishVoice) u.voice = danishVoice;
        u.rate = BASE_SPEECH_RATE * Math.sqrt(tempo);
        u.onend = u.onerror = resolve;
        speechSynthesis.speak(u);
      });
    }

    const timeLeft = () => endTime - Date.now();

    async function loop() {
      const id = session;
      const alive = () => running && id === session;
      while (alive()) {
        const dir = Math.random() < 0.5 ? "venstre" : "højre";
        commandEl.textContent = dir === "venstre" ? "⟵ Venstre" : "Højre ⟶";
        counts[dir]++;
        await say(dir);
        if (!alive()) return;

        await wait(pauseMs(TO_BACK_MIN, TO_BACK_MAX));
        if (!alive()) return;

        commandEl.textContent = "Tilbage";
        await say("tilbage");
        if (!alive()) return;

        const pause = pauseMs(TO_NEXT_MIN, TO_NEXT_MAX);
        // Don't start a new command that can't finish before the round ends
        if (timeLeft() < pause + TO_BACK_MIN / tempo + 1500) {
          await wait(Math.max(0, timeLeft()));
          if (alive()) finish(true);
          return;
        }
        commandEl.textContent = "";
        await wait(pause);
      }
    }

    function tick() {
      const secs = Math.max(0, Math.ceil(timeLeft() / 1000));
      timerEl.textContent = secs;
      if (secs === 0) finish(true);
    }

    function formatRest(ms) {
      const total = Math.floor(ms / 1000);
      return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, "0")}`;
    }

    function startRest() {
      const restStart = Date.now();
      timerEl.classList.add("rest");
      timerEl.textContent = formatRest(0);
      commandEl.textContent = "Pause";
      restHandle = setInterval(() => {
        timerEl.textContent = formatRest(Date.now() - restStart);
      }, 250);
    }

    function stopRest() {
      clearInterval(restHandle);
      timerEl.classList.remove("rest");
    }

    const COUNTDOWN = [[3, "tre"], [2, "to"], [1, "en"]];

    async function start() {
      stopRest();
      running = true;
      const id = ++session;
      const alive = () => running && id === session;
      counts = { venstre: 0, højre: 0 };
      endTime = 0; // stays 0 until the countdown is over
      button.textContent = "Stop";
      button.classList.add("stop");
      statsEl.textContent = "";
      speechSynthesis.cancel();

      timerEl.classList.add("countdown");
      commandEl.textContent = "Gør klar";
      for (const [n, word] of COUNTDOWN) {
        timerEl.textContent = n;
        await Promise.all([say(word), wait(1000)]);
        if (!alive()) return;
      }
      timerEl.classList.remove("countdown");

      endTime = Date.now() + ROUND_SECONDS * 1000;
      timerEl.textContent = ROUND_SECONDS;
      tickHandle = setInterval(tick, 200);
      loop();
    }

    function finish(completed) {
      if (!running) return;
      running = false;
      clearInterval(tickHandle);
      clearTimeout(waitHandle);
      speechSynthesis.cancel();
      timerEl.classList.remove("countdown");
      button.textContent = "Start igen";
      button.classList.remove("stop");
      if (endTime) statsEl.textContent = `Venstre: ${counts.venstre} · Højre: ${counts.højre}`;
      if (completed) {
        startRest();
        say("færdig");
      } else {
        commandEl.textContent = "";
        timerEl.textContent = ROUND_SECONDS;
      }
    }

    // Keep the screen awake once a session has started (rounds and rest).
    // The browser drops the lock when the app is hidden, so take it again on return.
    let wakeLock = null;
    let wantWakeLock = false;
    async function requestWakeLock() {
      if (!("wakeLock" in navigator) || wakeLock || document.visibilityState !== "visible") return;
      try {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => { wakeLock = null; });
      } catch {}
    }
    document.addEventListener("visibilitychange", () => {
      if (wantWakeLock) requestWakeLock();
    });

    button.addEventListener("click", () => {
      wantWakeLock = true;
      requestWakeLock();
      running ? finish(false) : start();
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
